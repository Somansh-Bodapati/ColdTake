# Local Postgres for dev/migrate/seed. Neon/Vercel accounts don't exist yet
# (see docs/DECISIONS.md), so this stands in for Neon until deploy time.
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Wipe:    docker compose down -v
#
# Then point DATABASE_URL (see .env.example) at:
#   postgres://coldtake:coldtake@localhost:5432/coldtake_dev
#
# Note: if port 5432 is already taken by a local Postgres install, either
# stop that instance or change the host port below (and DATABASE_URL to match).
services:
  postgres:
    image: postgres:16-alpine
    container_name: coldtake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coldtake
      POSTGRES_PASSWORD: coldtake
      POSTGRES_DB: coldtake_dev
    ports:
      - "5432:5432"
    volumes:
      - coldtake-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldtake -d coldtake_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coldtake-postgres-data:
