name: Ingest cron

# Doc 02 §4.4's recommendation: "GitHub Actions as the primary scheduler
# with an on-demand TTL refresh as a fallback ... Guard the ingestion
# endpoint with a bearer secret." Separate workflow file from ci.yml
# (Session 0) — this one runs on a schedule against the deployed app, not on
# every PR against the repo's own code.
#
# Interval: every 3 hours (8 calls/day), NOT every 30 minutes. This changed
# once a real CricketData.org (api.cricapi.com) account existed and its real
# constraint became known: 100 requests/day, hard, shared across every
# tournament this app ingests (docs/DECISIONS.md). The math the interval is
# chosen against: 24h / 3h = 8 calls/day for ONE tournament scheduled here,
# leaving ~92 of the daily 100 as headroom for (a) more than one tournament
# eventually running through this same workflow/secret, (b) manual/admin-
# triggered ingestion and settlement (each also spends a real call), and (c)
# CricketDataProvider itself only ever spending one call per getTable
# (series_info embeds the full match list — see that file's doc comment), so
# 8 scheduled calls really is ~8 hits, not a multiple of it. The previous
# 30-minute interval (48 calls/day for a single tournament) would have
# exhausted almost half the account's entire daily budget on its own, before
# counting any other tournament or manual trigger — a real risk of an outage
# on a live app, not a theoretical one.
#
# workflow_dispatch is added so a poll can be triggered by hand (verifying
# the secret/URL are wired up, or catching up after the 60-day scheduled-
# Actions-on-inactive-repos disable doc 02 §4.4 warns about) without waiting
# for the next scheduled tick — each manual trigger spends one real call too,
# so use it deliberately, not for routine polling.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      tournamentId:
        description: "Tournament id to ingest (defaults to the configured INGEST_TOURNAMENT_ID secret)"
        required: false
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/ingest/:tournamentId
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          TOURNAMENT_ID: ${{ inputs.tournamentId || secrets.INGEST_TOURNAMENT_ID }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INGEST_SECRET" ] || [ -z "$TOURNAMENT_ID" ]; then
            echo "APP_URL, INGEST_SECRET, and INGEST_TOURNAMENT_ID (or a workflow_dispatch tournamentId input) must all be set" >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${INGEST_SECRET}" \
            "${APP_URL%/}/api/ingest/${TOURNAMENT_ID}"
